<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xianyu-auto-reply · 代码库架构图</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --border:#e2e5ea; --text:#1f2328; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eff4ff;
    --ext:#E6F1FB; --ext-s:#185FA5; --ext-t:#0C447C;
    --cli:#FBEAF0; --cli-s:#993556; --cli-t:#72243E;
    --svc:#EEEDFE; --svc-s:#534AB7; --svc-t:#3C3489;
    --core:#E1F5EE; --core-s:#0F6E56; --core-t:#085041;
    --db:#FAEEDA; --db-s:#854F0B; --db-t:#633806;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.6;padding:28px 20px 60px}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:21px;font-weight:600}
  .repo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--accent);margin:2px 0 14px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:20px;
        padding:4px 13px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
  .panel h3{font-size:14px;font-weight:600;margin-bottom:3px}
  .panel .path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid #f2f4f6}
  .kv:last-child{border:none}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-weight:500}
  .list{margin:10px 0 4px}
  .list li{font-size:12.5px;margin-left:16px;color:var(--text);margin-bottom:3px}
  .tagline{display:inline-block;font-size:11px;border-radius:4px;padding:1px 7px;margin:2px 3px 2px 0}
  .hint{font-size:12px;color:var(--muted);padding:16px;text-align:center}
  svg{display:block;width:100%;height:auto}
  .node{cursor:pointer}
  .node rect{transition:stroke-width .12s}
  .node:hover rect{stroke-width:2}
  .node.sel rect{stroke-width:2.4}
  .edge{fill:none;stroke:#a8adb5;stroke-width:1.3}
  .edge.hot{stroke:var(--accent);stroke-width:2.2}
  .lay-lbl{font-size:11px;fill:#9aa0a8}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">

  <h1>代码库架构图</h1>
  <div class="repo">github.com/xiejinhe/xianyu-auto-reply</div>
  <div class="sub">按真实 import 关系与文件统计生成 · 点击任意节点查看详情与上下游依赖</div>
  <div class="chips">
    <div class="chip">Python <b>575</b> 文件</div>
    <div class="chip">TS / TSX <b>405</b> 文件</div>
    <div class="chip">数据模型 <b>72</b> 个</div>

    <div class="chip">前端页面 <b>40</b> 个</div>
    <div class="chip">共享层引用 <b>1182</b> 次</div>

  <div class="layout">

          </g>

          </g>

            <rect x="540" y="106" width="215" height="58" rx="9" fill="var(--cli)" stroke="var(--cli-s)" stroke-width="0.9"/>

            <text x="647" y="146" text-anchor="middle" font-size="11" fill="var(--cli-s)">桌面 GUI + 服务管理</text>
            <text x="647" y="158" text-anchor="middle" font-size="11" fill="var(--cli-s)">24 文件 · Nuitka 打包</text>

            <text x="147" y="258" text-anchor="middle" font-size="11" fill="var(--svc-s)">api 79 · services 96</text>
          </g>
          <g class="node" data-id="websocket">
            <rect x="272" y="204" width="215" height="62" rx="9" fill="var(--svc)" stroke="var(--svc-s)" stroke-width="0.9"/>
            <text x="379" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="var(--svc-t)">WebSocket · 8090</text>
            <text x="379" y="245" text-anchor="middle" font-size="11" fill="var(--svc-s)">闲鱼连接 · 56 文件</text>
            <text x="379" y="258" text-anchor="middle" font-size="11" fill="var(--svc-s)">消息 · 回复 · 发货</text>
          </g>

            <text x="611" y="245" text-anchor="middle" font-size="11" fill="var(--svc-s)">定时任务 · 40 文件</text>
            <text x="611" y="258" text-anchor="middle" font-size="11" fill="var(--svc-s)">30 个任务服务</text>
          </g>
          <g class="node" data-id="promotion">
            <rect x="736" y="204" width="215" height="62" rx="9" fill="var(--svc)" stroke="var(--svc-s)" stroke-width="0.9"/>
            <text x="843" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="var(--svc-t)">Promotion · 8092</text>
            <text x="843" y="245" text-anchor="middle" font-size="11" fill="var(--svc-s)">返佣子系统 · 40 文件</text>
            <text x="843" y="258" text-anchor="middle" font-size="11" fill="var(--svc-s)">选品 · 发布 · 删除</text>
          </g>

          <!-- 共享层 -->
          <g class="node" data-id="common">
            <rect x="272" y="342" width="456" height="72" rx="10" fill="var(--core)" stroke="var(--core-s)" stroke-width="1"/>

            <text x="500" y="386" text-anchor="middle" font-size="11.5" fill="var(--core-s)">228 文件 · 72 个数据模型 · 数据库会话 · 通用服务 · 工具</text>
            <text x="500" y="403" text-anchor="middle" font-size="11.5" fill="var(--core-s)">被全部服务引用，是整个项目依赖的枢纽</text>

            <text x="620" y="502" text-anchor="middle" font-size="11" fill="var(--db-s)">分布式锁 · 缓存</text>
          </g>

          <!-- 边：外部 -->
          <path class="edge" data-from="xianyu" data-to="websocket" d="M415 68 L415 200" marker-end="url(#ar)"/>
          <path class="edge" data-from="playwright" data-to="backend-web" d="M660 68 L560 120 L200 200" marker-end="url(#ar)"/>
          <path class="edge" data-from="playwright" data-to="websocket" d="M680 68 L470 200" marker-end="url(#ar)"/>

          <!-- 边：客户端 -> backend-web -->

          <text x="389" y="308" font-size="11" fill="#9aa0a8">290</text>

          <text x="800" y="308" font-size="11" fill="#9aa0a8">108</text>

    <div class="panel" id="detail">
      <div class="hint">点击左侧任意节点<br>查看职责、规模与依赖</div>

</div>

<script>
const NODES = {
  xianyu:{t:"闲鱼平台 Goofish",p:"外部依赖",tech:"WebSocket LWP + mtop HTTP API",
    role:"系统唯一对接的外部业务平台。所有消息收发、商品发布、订单同步都通过它完成。",
    pts:["WebSocket 走 LWP 协议收发聊天消息","HTTP 走 mtop 签名接口（评价、发货、商品）","需要账号 Cookie 与 _m_h5_tk 令牌"],
    up:[],down:["websocket"]},
  playwright:{t:"Playwright 浏览器",p:"外部依赖",tech:"Playwright + patchright（反指纹）",
    role:"负责一切需要真实浏览器完成的操作，主要是登录与过验证。",
    pts:["扫码登录 / 账号密码登录","滑块验证码（28 个文件在 common/services/captcha）","Cookie 接口续期失败时的浏览器兜底"],
    up:[],down:["backend-web","websocket"]},
  frontend:{t:"前端 Frontend",p:"frontend/ · 端口 9000",tech:"React 18 + TypeScript + Vite + TailwindCSS + Zustand",
    role:"主系统管理后台，所有操作界面。",
    size:"243 个 TS/TSX 文件，40 个页面目录",
    pts:["pages/ 40 个业务页面（账号/商品/订单/聊天/日志）","api/ 类型安全接口层","store/ Zustand 状态管理","components/ 复用组件"],
    up:[],down:["backend-web"]},
  mobile:{t:"xianyu-mobile",p:"xianyu-mobile/ · 移动端",tech:"Expo SDK 57 + React Native 0.86 + React 19",
    role:"Android 移动端客户端，与后端完全解耦，用户自托管服务器即可使用。",
    size:"122 个 TS/TSX 文件",
    pts:["4 大 Tab：消息 / 订单 / 商品 / 我的","13 个自研 UI 组件","多类型卡券、AI 上架、左滑操作","OpenAPI 契约驱动的类型安全调用"],
    up:[],down:["backend-web"]},
  launcher:{t:"Launcher 启动器",p:"launcher/ · Windows",tech:"Python GUI + Nuitka 打包 EXE",
    role:"桌面启动器，帮非技术用户一键启停整套服务。",
    size:"24 个 Python 文件",
    pts:["gui.py 图形界面","service_manager.py 服务进程管理","db_checker.py 数据库连接检查"],
    up:[],down:["backend-web"]},
  "backend-web":{t:"Backend-Web",p:"backend-web/ · 端口 8089",tech:"FastAPI + SQLAlchemy 2.0",
    role:"主 API 网关，承载绝大部分业务接口，是前端唯一直接对话的后端。",
    size:"183 个 Python 文件（api 79 · services 96）",
    pts:["商品管理、订单、卡券、账号、采集分销","对外公开 API（分销秘钥校验）","调用 Playwright 完成发布等浏览器操作"],
    up:["frontend","mobile","launcher","playwright"],down:["common"]},
  websocket:{t:"WebSocket 服务",p:"websocket/ · 端口 8090",tech:"FastAPI + websockets + aiohttp",
    role:"唯一与闲鱼保持长连接的服务，消息收发与自动化决策的心脏。",
    size:"56 个 Python 文件（services 39）",
    pts:["维持闲鱼 LWP 长连接与心跳","自动回复（关键词 / 默认 / AI / 站外联系）","自动发货、订单联动","Cookie 与 Token 刷新、滑块验证"],
    up:["xianyu","playwright"],down:["common"]},
  scheduler:{t:"Scheduler 定时任务",p:"scheduler/ · 端口 8091",tech:"FastAPI + APScheduler",
    role:"所有周期性任务的执行器，驱动自动发货与返佣铺货。",
    size:"40 个 Python 文件（services 30）",
    pts:["Cookie / Token 刷新、订单拉取、补发货","自动评价、求小红花、自动重新上架","商品采集、日切、数据库备份"],
    up:[],down:["common"]},
  promotion:{t:"Promotion 返佣子系统",p:"promotion/ · 端口 8092 / 9001",tech:"独立 FastAPI + 独立前端",
    role:"返佣业务：选品入素材库 → 定时发布 → 定时删除，独立于主系统。",
    size:"40 个 Python 文件，表统一 fy_ 前缀",
    pts:["选品规则抓取候选商品","素材库（标题/图片/淘口令/短链）","发布规则（默认 5 条/天）与删除规则","已发布商品 ID 回写、短链修复等补偿任务"],
    up:[],down:["common"]},
  common:{t:"common 共享内核",p:"common/",tech:"SQLAlchemy 2.0 + Loguru + Pydantic",
    role:"全部服务共享的模型层与服务层，是整个项目依赖的枢纽。",
    size:"228 个 Python 文件，72 个数据模型",
    pts:["models/ 72 张表（xy_ 主系统 + fy_ 返佣）","db/ 数据库会话与连接","services/ 通用服务（含 captcha 28 个文件）","utils/ 工具（签名、Cookie、通知）"],
    up:["backend-web","websocket","scheduler","promotion"],down:["mysql","redis"]},
  mysql:{t:"MySQL 8",p:"数据存储",tech:"关系型数据库",
    role:"主数据存储，所有业务表都在这里。",
    pts:["72 张表，启动时自动建表与补字段","主系统 xy_ 前缀，返佣 fy_ 前缀","不依赖外键，关系由代码维护"],
    up:["common"],down:[]},
  redis:{t:"Redis 7",p:"数据存储",tech:"内存数据库",
    role:"跨服务的并发协调者，主要是分布式锁。",
    pts:["发货锁：防同一订单重复发货","Token 请求锁：防并发刷新登录态","头像/用户信息缓存（24 小时）","Redis 挂了会降级为本机内存锁"],
    up:["common"],down:[]}
};

const svg = document.querySelector("svg");
const panel = document.getElementById("detail");

function render(id){
  const n = NODES[id]; if(!n) return;
  const tag = (x,c)=>`<span class="tagline" style="background:${c.bg};color:${c.fg}">${x}</span>`;
  const cUp={bg:"#E6F1FB",fg:"#0C447C"}, cDown={bg:"#E1F5EE",fg:"#085041"};
  let h = `<h3>${n.t}</h3><div class="path">${n.p}</div>`;
  h += `<div class="kv"><span>技术栈</span><span>${n.tech}</span></div>`;
  if(n.size) h += `<div class="kv"><span>规模</span><span>${n.size}</span></div>`;
  h += `<div style="font-size:12.5px;margin:12px 0 6px;color:var(--muted)">职责</div>`;
  h += `<div style="font-size:12.5px">${n.role}</div>`;
  h += `<div style="font-size:12.5px;margin:12px 0 4px;color:var(--muted)">关键构成</div><ul class="list">`;
  n.pts.forEach(p=>h+=`<li>${p}</li>`); h+=`</ul>`;
  if(n.up.length){ h+=`<div style="font-size:12.5px;margin:12px 0 4px;color:var(--muted)">被谁依赖</div><div>`;
    n.up.forEach(u=>h+=tag(NODES[u]?NODES[u].t:u,cUp)); h+=`</div>`; }
  if(n.down.length){ h+=`<div style="font-size:12.5px;margin:10px 0 4px;color:var(--muted)">依赖什么</div><div>`;
    n.down.forEach(d=>h+=tag(NODES[d]?NODES[d].t:d,cDown)); h+=`</div>`; }
  panel.innerHTML = h;
}

function highlight(id){
  svg.querySelectorAll(".edge").forEach(e=>{
    e.classList.toggle("hot", e.dataset.from===id || e.dataset.to===id);
  });
  svg.querySelectorAll(".node").forEach(n=>n.classList.toggle("sel", n.dataset.id===id));
}

svg.querySelectorAll(".node").forEach(g=>{
  g.addEventListener("click",()=>{ render(g.dataset.id); highlight(g.dataset.id); });
  g.addEventListener("mouseenter",()=>highlight(g.dataset.id));
  g.addEventListener("mouseleave",()=>{
    const sel=svg.querySelector(".node.sel");
    if(sel) highlight(sel.dataset.id); else svg.querySelectorAll(".edge").forEach(e=>e.classList.remove("hot"));
  });
});
